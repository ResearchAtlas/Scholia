[project]
name = "scholia"
version = "0.1.0"
description = "Scholia: a local-first research platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0,<0.122",
    "uvicorn[standard]>=0.32.0,<0.39",
    "httpx>=0.27.0,<0.29",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "platformdirs>=4.3.0",
    "pywebview>=6.1,<7",
    "tomlkit>=0.15.1",
    "keyring>=25.7.0",
    "sqlite-vec==0.1.9",
    "apsw>=3.53.4.0,<3.54",
    "pyobjc-framework-vision>=12.1,<12.2 ; sys_platform == 'darwin'",
    "pyzipper>=0.4.0,<0.5",
]

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]

[dependency-groups]
citeproc-spike = [
    "wasmtime==49.0.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
]
packaging = [
    "pyinstaller>=6.19.0,<7",
]

[tool.uv]
package = false
# The tests cover the license audit, which reads PyInstaller's installed metadata.
default-groups = ["dev", "packaging"]
# The server stack is bounded to the release series CI tests (the locked versions).
# Starlette comes through FastAPI.
constraint-dependencies = ["starlette<0.51"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Only named plugins load, so nothing imports before the network block installs
# except pytest-asyncio, a pinned dev dependency.
addopts = ["--disable-plugin-autoload", "-p", "pytest_asyncio.plugin", "--strict-markers"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

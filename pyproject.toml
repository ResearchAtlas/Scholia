[project]
name = "scholia"
version = "0.1.0"
description = "Scholia: a local-first research platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "platformdirs>=4.3.0",
    "pywebview>=6.1",
]

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
packaging = [
    "pyinstaller>=6.19.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

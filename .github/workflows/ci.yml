name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv uses the python.org interpreter that actions/setup-python installs, never its own.
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON_PREFERENCE: only-system

jobs:
  backend:
    name: Backend tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - name: Check the lockfile
        run: uv lock --check
      - name: Install
        run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"
      - name: Check the interpreter
        run: |
          uv run --no-sync python - <<'EOF'
          import platform, sys
          print(sys.version, platform.machine(), sys.base_prefix)
          assert sys.version_info[:2] == (3, 13), sys.version
          assert platform.machine() == "arm64", platform.machine()
          assert sys._framework == "Python", "not the python.org framework build"
          EOF
      - name: Tests
        # The runner passes every step two macOS kernel-control sockets (com.apple.netsrc).
        # The test network block will not start beside a socket it cannot inspect, so
        # pytest runs in a child process that inherits only stdin, stdout and stderr.
        run: >
          uv run --no-sync python -c
          'import subprocess, sys; sys.exit(subprocess.call([sys.executable, "-m", "pytest", "-q"]))'

  frontend:
    name: Frontend tests
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Tests
        run: node --test
      - name: Build
        run: npm run build
      # docs/interface-criteria.md, Performance: the script loaded at start stays under 600 kB minified.
      - name: Interface script size
        run: node ../tools/script_size.mjs dist

  package:
    name: Packaged build and license audit
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - name: Install
        run: uv sync --locked --group packaging --python "${{ steps.python.outputs.python-path }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Fetch and verify the llama.cpp release
        run: uv run --no-sync python tools/fetch.py llama.cpp build/downloads
      # The model is never committed; the cache only saves the download, and fetch.py
      # checks the cached file against the pin before anything uses it.
      - name: Restore the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/models
          key: embedding-model-06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439
      - name: Fetch and verify the embedding model
        run: uv run --no-sync python tools/fetch.py embedding-model build/models
      - name: Build the app and the DMG
        run: uv run --no-sync tools/build_app.sh build/downloads/llama-b11146-bin-macos-arm64.tar.gz
      - name: Open the DMG
        run: |
          mkdir build/mnt
          hdiutil attach build/Scholia.dmg -readonly -nobrowse -mountpoint build/mnt
          ls -la build/mnt
          test "$(ls -A build/mnt)" = "$(printf 'Applications\nScholia.app')"
          test "$(readlink build/mnt/Applications)" = /Applications
          codesign --verify --deep --strict "build/mnt/Scholia.app"
          codesign -dv "build/mnt/Scholia.app" 2>&1 | grep -x "Signature=adhoc"
          codesign -dv "build/mnt/Scholia.app/Contents/MacOS/llama-server" 2>&1 | grep -x "Signature=adhoc"
      - name: Self-test the app inside the DMG
        env:
          EXPECTED_PYTHON: ${{ steps.python.outputs.python-version }}
        run: |
          set -o pipefail
          "build/mnt/Scholia.app/Contents/MacOS/Scholia" --self-test \
            --model build/models/Qwen3-Embedding-0.6B-Q8_0.gguf | tee build/self-test.json
          uv run --no-sync python - build/self-test.json <<'EOF'
          import json, os, sys
          result = json.load(open(sys.argv[1]))
          r = result["runtime"]
          assert result["ok"] is True, result
          assert r["frozen"] is True, r
          assert r["python"] == os.environ["EXPECTED_PYTHON"] and r["python"].startswith("3.13."), r
          assert r["implementation"] == "CPython" and r["machine"] == "arm64", r
          assert r["framework"] == "Python", "not the python.org framework build"
          EOF
      - name: License audit of the app inside the DMG
        run: |
          find "build/mnt/Scholia.app" -type f | sort
          uv run --no-sync python tools/license_audit.py "build/mnt/Scholia.app"
      - name: Close the DMG
        if: always()
        run: if [ -e "build/mnt/Scholia.app" ]; then hdiutil detach build/mnt; fi
      # The checked DMG, kept for testing the packaged app on a Mac (Harold, 2026-10-07): its
      # SHA-256, the commit and tree it was built from, and the digest of the interface it bundles
      # (each file's path and SHA-256, as tests/walkthrough_driver.mjs computes it).
      - name: Record the DMG
        run: |
          {
            echo "dmg_sha256 $(shasum -a 256 build/Scholia.dmg | cut -d' ' -f1)"
            echo "commit $(git rev-parse HEAD)"
            echo "pr_head ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "tree $(git rev-parse 'HEAD^{tree}')"
            echo "interface_digest $(cd frontend/dist && find . -type f | sed 's|^\./||' | LC_ALL=C sort | while read -r f; do printf '%s\0%s\n' "$f" "$(shasum -a 256 "$f" | cut -d' ' -f1)"; done | shasum -a 256 | cut -d' ' -f1)"
          } | tee build/Scholia.dmg.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scholia-dmg
          path: |
            build/Scholia.dmg
            build/Scholia.dmg.txt
          if-no-files-found: error
          retention-days: 14
